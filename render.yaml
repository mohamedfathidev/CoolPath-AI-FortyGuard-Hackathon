# Render Blueprint for the CoolPath backend (free web service).
# Deploy: push this repo to GitHub, then in Render → New → Blueprint, pick the repo.
# Set the secret env vars (marked sync:false) in the Render dashboard after the first deploy.
services:
  - type: web
    name: coolpath-server
    runtime: node
    plan: free
    rootDir: apps/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: FORTYGUARD_API_KEY
        sync: false
      - key: FORTYGUARD_BASE_URL
        value: https://api.fortyguard.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: DATABASE_URL
        sync: false
